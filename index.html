<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BS2: DELUXE — glebayz!</title>

<style>
  :root{
    --bg:#050506;
    --panel:#0e0f12;
    --text:#f0f0f0;
    --muted:#6b6f78;
    --accent:#ff5a36;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,90,54,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:56px 20px;
  }
  .wrap{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .logo{
    width:130px;
    height:auto;
    opacity:0.95;
    margin-bottom:32px;
    filter:invert(1);
  }
  .cover{
    width:min(78vw, 320px);
    height:min(78vw, 320px);
    border-radius:4px;
    overflow:hidden;
    box-shadow: 0 40px 80px -30px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.06);
  }
  .cover img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .artist{
    margin:32px 0 10px;
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight:700;
    font-size:clamp(28px, 7vw, 38px);
    letter-spacing:0.01em;
    line-height:1.1;
  }
  .album{
    margin:0 0 30px;
    color:var(--text);
    font-size:15px;
    font-weight:500;
    letter-spacing:0.01em;
  }
  .handle{
    margin:0 0 30px;
    color:var(--muted);
    font-size:13px;
  }
  .countdown{
    display:flex;
    gap:18px;
    margin-bottom:10px;
  }
  .unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:54px;
  }
  .num{
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight:700;
    font-size:clamp(32px, 8.5vw, 44px);
    line-height:1;
    font-variant-numeric:tabular-nums;
    color:var(--text);
  }
  .label{
    margin-top:4px;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.04em;
  }
  .release-date{
    color:var(--muted);
    font-size:13px;
    margin-bottom:34px;
  }
  .cta{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    padding:16px 0;
    border-radius:999px;
    background:var(--accent);
    color:#050506;
    font-weight:600;
    font-size:16px;
    text-decoration:none;
    border:none;
    cursor:pointer;
    transition:transform 0.15s ease, opacity 0.15s ease;
  }
  .cta[disabled]{
    background:transparent;
    border:1.5px solid rgba(255,255,255,0.14);
    color:var(--muted);
    cursor:default;
  }
  .cta:not([disabled]):hover{ transform:translateY(-2px); }
  .cta:not([disabled]):active{ transform:translateY(0); opacity:0.85; }
</style>
</head>

<script>
  const target = new Date(2026, 8, 25, 14, 0, 0).getTime(); // 25.09.2026 14:00 (локальное время слушателя)

  const hh = document.getElementById('hh');
  const mm = document.getElementById('mm');
  const ss = document.getElementById('ss');
  const btn = document.getElementById('ctaBtn');
  const countdownEl = document.getElementById('countdown');

  function pad(n){ return String(n).padStart(2,'0'); }

  function tick(){
    const now = Date.now();
    const diff = target - now;

    if(diff <= 0){
      countdownEl.style.display = 'none';
      btn.removeAttribute('disabled');
      btn.textContent = 'Listen now';
      btn.onclick = () => window.open(listenUrl, '_blank');
      clearInterval(timer);
      return;
    }

    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);

    dd.textContent = pad(d);
    hh.textContent = pad(h);
    mm.textContent = pad(m);
    ss.textContent = pad(s);
  }

  tick();
  const timer = setInterval(tick, 1000);
